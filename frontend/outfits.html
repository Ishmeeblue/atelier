<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atelier · Outfits</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="theme.js"></script>
</head>
<body class="bg-cream text-ink font-body min-h-screen">

  <header class="flex items-center justify-between px-6 py-4 border-b border-line">
    <div class="font-display text-xl tracking-wide">Atelier</div>
    <nav class="flex gap-2 bg-white border border-line rounded-full p-1">
      <a href="/closet.html" class="px-4 py-1.5 rounded-full text-sm text-inksoft">Closet</a>
      <a href="/outfits.html" class="px-4 py-1.5 rounded-full text-sm bg-ink text-cream">Outfits</a>
    </nav>
  </header>

  <main class="max-w-3xl mx-auto px-5 py-6">

    <div id="outfits-list-view">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-display text-xl">Your outfits</h2>
        <button id="open-builder" class="bg-ink text-cream text-sm px-4 py-2 rounded-lg">+ New outfit</button>
      </div>
      <div id="outfits-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-4"></div>
    </div>

    <div id="builder-view" class="hidden">
      <button id="back-to-outfits" class="text-sm text-inksoft underline mb-4">&larr; Back to outfits</button>

      <div class="grid sm:grid-cols-2 gap-6">
        <div id="builder-picker"></div>

        <div class="bg-white border border-line rounded-xl p-4 h-fit">
          <div id="board-collage" class="bg-cream rounded-lg p-3 mb-3 min-h-[100px] flex items-center justify-center">
            <span class="text-xs text-inksoft">Tap pieces to add them here</span>
          </div>
          <input id="outfit-name" type="text" placeholder="Name this outfit"
            class="w-full border border-line bg-cream rounded-lg px-3 py-2 text-sm mb-3" />
          <ul id="board-list" class="text-sm space-y-1 mb-3"></ul>
          <button id="save-outfit" disabled
            class="w-full bg-ink text-cream text-sm py-2 rounded-lg disabled:opacity-40">
            Save outfit
          </button>
        </div>
      </div>
    </div>

  </main>

  <div id="outfit-preview-modal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
    <div class="bg-cream rounded-xl w-full max-w-sm p-5">
      <div class="flex items-center justify-between mb-4">
        <h3 id="preview-name" class="font-display text-lg"></h3>
        <button id="close-preview" class="text-inksoft">&times;</button>
      </div>
      <div id="preview-collage" class="mb-4"></div>
      <div class="flex justify-end">
        <button id="preview-delete-btn" class="text-sm text-wine border border-line rounded-lg px-3 py-1.5">Delete outfit</button>
      </div>
    </div>
  </div>

  <script src="outfits.js"></script>
</body>
</html>
